<!DOCTYPE html>
<html lang="en" data-role="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Vendo</title>
  <script src="../../src/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>
  <main class="split">
    <section class="split-art">
      <h1 class="h-display">Welcome to Vendo</h1>
      <p>Live shops, short video, and a storefront that stays calm on the eyes.</p>
    </section>
    <section style="padding:48px;max-width:420px;margin:auto;width:100%" class="stack">
      <h2 class="h2">Sign in</h2>
      <form class="stack" action="onboarding.html">
        <div><label class="label" for="email">Email</label><input class="field" id="email" type="email" required autocomplete="username"></div>
        <div><label class="label" for="pw">Password</label><input class="field" id="pw" type="password" required autocomplete="current-password"></div>
        <button class="btn btn-cta btn-block" type="submit">Continue</button>
      </form>
      <a class="btn btn-outline" href="checkout.html">Guest checkout</a>
      <a href="../vendor/onboarding.html">Sell on Vendo</a>
      <a href="../index.html">All roles</a>
    </section>
  </main>
</body>
</html>
