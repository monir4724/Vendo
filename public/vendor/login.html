<!DOCTYPE html>
<html lang="en" data-role="vendor">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendor login · Vendo</title>
  <script src="../../src/js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>
  <main class="container" style="min-height:100dvh;display:grid;place-items:center">
    <form class="card stack" style="width:min(400px,100%)" action="dashboard.html">
      <div class="flex gap-2" style="align-items:center"><span class="brand-mark">V</span><strong>Vendor</strong></div>
      <div><label class="label" for="e">Email</label><input class="field" id="e" type="email" required></div>
      <div><label class="label" for="p">Password</label><input class="field" id="p" type="password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
      <a href="onboarding.html">Create a shop</a>
    </form>
  </main>
</body>
</html>
